<mat-card appearance="filled">
  <mat-card-header style="padding-bottom: 20px">
    <mat-card-title>{{ project().title }}</mat-card-title>
  </mat-card-header>
  <img mat-card-image src="{{ project().imageLink }}" alt="project-image">
  <mat-card-content>
    <p>{{ project().description }}</p>
  </mat-card-content>
  <mat-card-actions>
    <form action="{{ project().repoLink }}">
      <button mat-button>Link to the Project</button>
    </form>
  </mat-card-actions>
</mat-card>
